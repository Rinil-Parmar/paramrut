<script>
	//resize text function 
function resizeText(multiplier) {
		if (document.body.style.fontSize == "") {
			document.body.style.fontSize = "1.0em";
		}
		document.body.style.fontSize = parseFloat(document.body.style.fontSize) + (multiplier * 0.1) + "em";
}

//Added function 2020-10-08 highlight text
function highlight_word(search_text)
{
 var searchpara=document.getElementById("vaat1_1").innerHTML;
 searchpara=searchpara.toString();
 var text=search_text;
 if(text)
 {
  var pattern=new RegExp( text , "ugi");
  var new_text=searchpara.replace(pattern, "<span class='highlight'>"+text+"</span>");
  document.getElementById("vaat1_1").innerHTML=new_text;
 }
}

	// Added this function
	function invert() {
		if (document.documentElement.classList.contains('invert_theme')) {
			document.documentElement.classList.remove('invert_theme');
		}else {
			document.documentElement.classList.add('invert_theme');
		}
	}

	//Change font function 
	var state1 = false
	var state2 = false
	function changeFont(n) {
		if (n == 1) {
			state2 = false;
			if (state1 === false) {
				document.body.removeAttribute('class');
				document.body.classList.add('font_lohit');
				document.querySelector('.change_font.font_ekatra').classList.remove('active');
				document.querySelector('.change_font.font_lohit').classList.add('active');
				state1 = true;
			} else {
				document.body.removeAttribute('class');
				document.querySelector('.change_font.font_lohit').classList.remove('active');
				state1 = false;
			}
		}
		if (n == 2) {
			state1 = false;
			if (state2 === false) {
				document.body.removeAttribute('class');
				document.body.classList.add('font_ekatra');
				document.querySelector('.change_font.font_lohit').classList.remove('active');
				document.querySelector('.change_font.font_ekatra').classList.add('active');
				state2 = true;
			} else {
				document.body.removeAttribute('class');
				document.querySelector('.change_font.font_ekatra').classList.remove('active');
				state2 = false;
			}
		}

	}


	
</script>
</head>
<body>
<div>

	<div class="wrap">

		<ul class="reader_tools noselect"> 
 <li><button class="invert_theme_btn" onclick="invert();"><span>invert theme</span></button></li>
			<li><button class="change_font font_lohit" data-btn='1' onclick="changeFont(1);">અ</button></li>	
			<li><button class="change_font font_ekatra" data-btn='2' onclick="changeFont(2);">અ</button></li>	
			<li><button class="inc_fontsize" onclick="resizeText(1)"> A+</button></li>
			 
 <li><button class="dec_fontsize" onClick="resizeText(-1)">A-</button></li> 
</ul>
