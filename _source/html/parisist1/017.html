		<h1 class="title_gu">  ગય રાજા  </h1>
 
 ગય નામના રાજા. એ અમૂર્રયના એક ધર્મપરાયણ રાજા મહાભારતકાળમાં થઈ ગયા. મહાભારત અનુસાર આ રાજાએ સો વર્ષ સુધી યજ્ઞોમાં બચેલું અન્ન ખાધું હતું ! તે રાજા મોટું દાન કરતા. વિષ્ણુની યોગશક્તિનું તેમને જ્ઞાન હતું. તે ભગવાનનો અંશ કહેવાતા. પ્રજાનું પાલન પુત્રની માફક કરતા.<a href="ch3063.html">(૩/૬૩) </a>
