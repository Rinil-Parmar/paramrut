 <h1 class="title_gu"> સૂર્ય ને વાલખિલ્ય ઋષિ   </h1>
 
  વાલખિલ્ય નામનો ઋષિસમુદાય ફક્ત એક અંગુઠા જેવડો આકાર ધરાવે છે. આ સાઠ હજાર ઋષિઓ પ્રજાપતિના વાળમાં ઉત્પ્ન્ન થયા હતા. તેઓ સૂર્યના અનન્ય ભક્ત છે તેથી સૂર્યલોકમાં રહે છે ને સૂર્યકિરણોનું પાન કરે છે. <a href="ch6119.html">(૬/૧૧૯)</a>
