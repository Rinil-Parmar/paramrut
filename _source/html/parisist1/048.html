			<h1 class="title_gu">ભારો ન ચઢાવ્યો    </h1>
 
  ગામડામાં સ્ત્રી ખેતરે એકલી ઘાસ કે ચાર લેવા જાય. એ ઘાસનો ભાર માથે મુકાવવા માટે રસ્તા પર જતા વટેમાર્ગુને બોલાવે. વટેમાર્ગુ જો સત્સંગી હોય તો તે એકાંત જાણીને તેની નજીક ન જાય. એકાંતમાં સ્ત્રીને મદદ કરવી તે પણ કલંકરૂપ છે. <a href="ch6101.html">(૬/૧૦૧)</a>
