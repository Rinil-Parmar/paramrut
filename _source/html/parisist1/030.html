			<h1 class="title_gu">  દીવાનજી  </h1>
 
  સિંધિયા, ગાયકવાડ ને હોલ્કર - ત્રણ રાજ્યનું દિવાનપણું કરનાર એક બુદ્ધિશાળી નાગર. તેમને શ્રીજીમહારાજ પ્રત્યે દ્વેષબુદ્ધિ હતી. જેમને ઓળખવા જેવા છે તેમને જ ના ઓળખી શક્યા એટલે મૂર્ખ ઠર્યા. <a href="ch2023.html">(૨/૨૩)</a>
