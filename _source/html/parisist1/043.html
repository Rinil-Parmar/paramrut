			<h1 class="title_gu">પ્રિયવ્રત    </h1>
 
  સ્વાયંભુવ મનુના પુત્ર. નારદજીના સમાગમથી તેઓ રાજપાટ છોડી સાધુ થયા. પછી બ્રહ્માની દરમિયાનગીરીથી પાછા સંસારમાં આવ્યા છતાં મન તો ત્યાગી જેવું જ હતું. ગૃહસ્થ હોવા છતાં આત્મારામ ને મહાભાગવત કહેવાયા. જગતથી નિર્લેપ રહ્યા. (<a href="ch1113.html">૧/૧૧૩</a>, <a href="ch1163.html">૧/૧૬૩</a>)
