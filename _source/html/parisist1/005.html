		<h1 class="title_gu"> અંગદે પગ રોપ્યો  </h1>
 
  યુદ્ધ ન થાય ને સીતાજી મળે એ હેતુથી વિષ્ટિ માટે રામચન્દ્રજીએ અંગદ નામના વાનરને રાવણ પાસે મોકલ્યો. અંગદ રાવણની સભામાં પગ સ્થિર કરી ઊભો ને બોલ્યો : ‘મારો પગ કોઈ એક તસુ પણ ખસેડે તો રામ સીતાજીને હારી ગયા એમ માનજો.’ એક પછી એક બધા રાક્ષસોએ સાહસ કર્યુ; પણ કોઈથી કંઈ થઈ શક્યું નહિ.  <a href="ch3016.html">(૩/૧૬)</a>
