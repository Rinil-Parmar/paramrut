 <h1 class="title_gu"> રાજાને પાણી ન પાયું   </h1>
  શિકારે નીકળેલો એક રાજા તરસ્યો થયો. દૂર એક ખેડૂત હળ ચલાવતો હતો, પાણીની આશાએ રાજા તેના તરફ ચાલ્યો. ખેડૂતે અદેખાઈથી પાણી હતું તે બધું ઢોળી નાખ્યું. પરંતુ રાજાએ સંકલ્પ કરેલો કે મારે તેને ગામ આપવું છે તે સજ્જનતા દાખવી ને ગામ આપ્યું. <a href="ch1213.html">(૧/૨૧૩)</a>
