			<h1 class="title_gu">ભીષ્મપિતા    </h1>
 
 
 ભીષ્મ પિતામહ પાંડવ-કૌરવના દાદા થાય. તેમને કૌરવોનો પક્ષ બંધાઈ ગયો. તેમણે કૌરવોનું અન્ન ખાધેલું તેથી ભગવાન શ્રીકૃષ્ણનો નિશ્ર્ચય હોવા છતાં તેમનું જ્ઞાન અવળા પક્ષે કરીને ઢંકાઈ ગયું, વ્યર્થ ગયું. <a href="ch5299.html">(૫/૨૯૯)</a>
