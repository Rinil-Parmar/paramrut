 <h1 class="title_gu">  ઘોડી ને અસવારનું  </h1>
  નદી પાર કરતાં ઘોડી પર બેઠેલ અસવાર ચાર વાર પડી ગયો ને ઘોડીએ તેને ચાર વાર બચાવ્યો. ઘોડી જાણે છે કે આ વ્યક્તિ મારે આશરે છે, તેને તારવો જોઈએ. તેમ જીવને ભગવાનનો આશરો હોય તો ભગવાન તેની રક્ષા કરે. <a href="ch5006.html">(૫/૬)</a>
