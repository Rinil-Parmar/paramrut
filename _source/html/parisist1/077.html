			<h1 class="title_gu"> સંગ કરવાનું પૂછ્યું  </h1>
 
  આ સંદર્ભમાં આપેલ ઉત્તર પ્રાસંગિક છે, સિદ્ધાંત અને તાત્પર્યાર્થ એવો છે કે જીવ ગુણાતીત સત્પુરુષ પ્રાગજીભક્તમાં જ જોડવો. સંગ અનેકનો થઈ શકે પણ જીવ જોડવા માટે તો એક જ ગુણાતીત સત્પુરુષ જ છે. <a href="ch5387.html">(૫/૩૮૭)</a>
